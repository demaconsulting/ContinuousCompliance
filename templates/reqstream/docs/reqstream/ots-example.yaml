---
# Off-the-Shelf (OTS) Software Requirements Example
#
# PURPOSE:
# - Demonstrate OTS software requirements in ReqStream YAML format
# - OTS requirements document what functionality is needed from a third-party component
# - Tests verify that the OTS component satisfies the stated requirements
#
# USAGE:
# - Replace "SystemTextJson" with the name of the OTS component you are using
# - Add, remove, or modify requirements to match your project's needs
# - Reference tests using the id of the test method in your test suite

sections:
  - title: OTS Software Requirements
    sections:
      - title: System.Text.Json
        requirements:
          - id: SystemTextJson-ReadJson
            title: System.Text.Json shall be able to read JSON files.
            justification: |
              The application must deserialize JSON configuration and data files at
              runtime. System.Text.Json is used as the JSON parsing library, so it
              must correctly read well-formed JSON input.
            tests:
              - SystemTextJson_ReadJson

          - id: SystemTextJson-WriteJson
            title: System.Text.Json shall be able to write JSON files.
            justification: |
              The application must serialize data structures to JSON files for
              persistence and interoperability. System.Text.Json is used as the
              JSON serialization library, so it must correctly produce well-formed
              JSON output.
            tests:
              - SystemTextJson_WriteJson
