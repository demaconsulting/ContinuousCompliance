---
# .reviewmark.yaml
#
# PURPOSE:
# - Define which files require review and how they are grouped into review-sets
# - Each review-set groups the requirements, design, source, and tests for one software unit
#
# USAGE:
# - Run ReviewMark to generate the Review Plan and Review Report:
#
#   dotnet reviewmark \
#     --plan docs/code_review_plan/plan.md \
#     --plan-depth 1 \
#     --report docs/code_review_report/report.md \
#     --report-depth 1 \
#     --enforce
#

# Patterns identifying all files that require review.
# Processed in order; prefix a pattern with '!' to exclude.
needs-review:
  - "docs/reqstream/**/*.yaml"
  - "docs/design/**/*.md"
  - "src/**/*.cs"
  - "test/**/*.cs"

# Source of review evidence - see ReviewMark user guide.
evidence-source:
  type: none

reviews:
  # Software unit review — MathHelper class
  - id: MathHelper
    title: Review of MathHelper class
    paths:
      - "docs/reqstream/math-helper-requirements.yaml"
      - "docs/design/math-helper-design.md"
      - "src/MathHelper.cs"
      - "test/MathHelperTests.cs"

  # Software unit review — StringHelper class
  - id: StringHelper
    title: Review of StringHelper class
    paths:
      - "docs/reqstream/string-helper-requirements.yaml"
      - "docs/design/string-helper-design.md"
      - "src/StringHelper.cs"
      - "test/StringHelperTests.cs"
