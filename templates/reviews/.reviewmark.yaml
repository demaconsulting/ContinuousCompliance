---
# .reviewmark.yaml
#
# PURPOSE:
# - Define which files require review and how they are grouped into review-sets
# - Review-sets group related requirements, design, source, and tests by scope level
# - (system, subsystem, design, or unit level)
#
# USAGE:
# - Run ReviewMark to generate the Review Plan and Review Report:
#
#   dotnet reviewmark \
#     --plan docs/code_review_plan/plan.md \
#     --plan-depth 1 \
#     --report docs/code_review_report/report.md \
#     --report-depth 1 \
#     --enforce
#

# Patterns identifying all files that require review.
# Processed in order; prefix a pattern with '!' to exclude.
needs-review:
  - "docs/reqstream/**/*.yaml"
  - "docs/design/**/*.md"
  - "src/**/*.cs"
  - "test/**/*.cs"

# Source of review evidence - see ReviewMark user guide.
evidence-source:
  type: none

reviews:
  # System review — system-level design and integration overview
  - id: TemplateReviews-System
    title: System Integration Review
    paths:
      - "docs/design/introduction.md"
      - "docs/design/example-system.md"

  # Design review — all design documentation
  - id: TemplateReviews-Design
    title: Architecture and Design Review
    paths:
      - "docs/design/**/*.md"

  # Subsystem review — Helpers subsystem
  - id: TemplateReviews-Helpers
    title: Review of Helpers subsystem
    paths:
      - "docs/design/helpers.md"
      - "docs/design/math-helper-design.md"
      - "docs/design/string-helper-design.md"
      - "src/Helpers/**/*.cs"
      - "test/**/*.cs"

  # Software unit review — MathHelper class
  - id: MathHelper
    title: Review of MathHelper class
    paths:
      - "docs/reqstream/math-helper-requirements.yaml"
      - "docs/design/math-helper-design.md"
      - "src/Helpers/MathHelper.cs"
      - "test/MathHelperTests.cs"

  # Software unit review — StringHelper class
  - id: StringHelper
    title: Review of StringHelper class
    paths:
      - "docs/reqstream/string-helper-requirements.yaml"
      - "docs/design/string-helper-design.md"
      - "src/Helpers/StringHelper.cs"
      - "test/StringHelperTests.cs"
